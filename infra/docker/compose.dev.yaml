services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    container_name: ${COMPOSE_PROJECT_NAME:-property_rental_manager}_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-property_rental_manager}
      POSTGRES_USER: ${POSTGRES_USER:-property_rental_manager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      LANG: C.UTF-8
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - property_rental_network

  adminer:
    image: adminer:latest
    container_name: ${COMPOSE_PROJECT_NAME:-property_rental_manager}_adminer
    profiles:
      - tools
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - property_rental_network

volumes:
  postgres_data:
    name: ${COMPOSE_PROJECT_NAME:-property_rental_manager}_postgres_data

networks:
  property_rental_network:
    name: ${COMPOSE_PROJECT_NAME:-property_rental_manager}_network
